<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>nowish.</title>
<meta name="theme-color" content="#EEF1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="nowish">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "Bricolage"; src: url("fonts/bricolage.woff2") format("woff2");
  font-weight: 200 800; font-display: swap;
}
:root {
  --rev-ink: #6B5200;
  --bg: #EEF1F7; --surface: #FFFFFF; --sunk: #E3E8F2; --ink: #131729; --ink-2: #4A5170; --muted: #7A819C;
  --line: #D9DEEA; --cobalt: #2F4BFF; --cobalt-ink: #FFFFFF; --cobalt-soft: #E2E7FF;
  --sign: #FFD23F; --sign-ink: #2A2100; --sign-soft: #FFF3C4;
  --ok: #0B8A5F; --ok-soft: #DDF4EA; --bad: #D93A3F; --bad-soft: #FDE4E4;
  --display: "Bricolage", -apple-system, "SF Pro Display", system-ui, sans-serif;
  --text: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --r-sm: 10px; --r: 18px; --r-lg: 26px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0D1120; --surface: #171C30; --sunk: #222842; --ink: #EEF0F8; --ink-2: #BAC0D6; --muted: #858CA8;
    --line: #2A3150; --cobalt: #8093FF; --cobalt-ink: #0D1120; --cobalt-soft: #222B55;
    --sign: #FFD23F; --sign-ink: #2A2100; --sign-soft: #3A3315;
    --rev-ink: #FFD98A;
    --ok: #3DD69C; --ok-soft: #12302A; --bad: #FF7A7E; --bad-soft: #3A1C24;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--text);
  -webkit-text-size-adjust: 100%; min-height: 100vh;
  padding: calc(env(safe-area-inset-top) + 8px) 0 calc(84px + env(safe-area-inset-bottom));
}
main { max-width: 540px; margin: 0 auto; padding: 12px 20px 24px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Tipografia */
.display { font-family: var(--display); font-weight: 800; letter-spacing: -.035em; line-height: 1; }
h1 { font-family: var(--display); font-weight: 750; font-size: 34px; line-height: 1.05; letter-spacing: -.03em; margin: 0 0 6px; }
h2 { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 2px; }
h3 { font-size: 17px; font-weight: 600; margin: 0; line-height: 1.3; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.tiny { font-size: 13px; }

/* Cabeçalho do início */
.brand { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 22px; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -.045em; }
.wordmark i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--sign); margin-left: 2px; }
.streak { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px 6px 8px; font-weight: 700; font-size: 15px; }
.streak svg { width: 20px; height: 20px; }
.hello { font-family: var(--display); font-weight: 650; font-size: 40px; line-height: 1.02; letter-spacing: -.035em; margin: 0 0 6px; }
.date { color: var(--muted); font-size: 15px; margin-bottom: 20px; }
.meter { display: flex; gap: 20px; margin-bottom: 24px; }
.meter div { font-size: 13px; color: var(--muted); line-height: 1.25; }
.meter b { display: block; font-family: var(--display); font-size: 24px; color: var(--ink); letter-spacing: -.02em; }

/* Revisão em destaque: amarelo de placa de ponto */
.due { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0; cursor: pointer;
  background: var(--sign); color: var(--sign-ink); border-radius: var(--r-lg); padding: 18px 18px 18px 20px; margin-bottom: 28px; }
.due .n { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: .9; letter-spacing: -.04em; }
.due h3 { font-size: 17px; }
.due p { margin: 0; font-size: 14px; opacity: .8; }
.due .go { margin-left: auto; width: 40px; height: 40px; border-radius: 50%; background: var(--sign-ink); color: var(--sign); display: grid; place-items: center; flex: none; }

/* Linha da semana: as seções são paradas de um trajeto */
.week { margin-bottom: 28px; }
.week-head { margin-bottom: 14px; }
.route { list-style: none; margin: 0; padding: 0; position: relative; }
.route::before { content: ""; position: absolute; left: 15px; top: 22px; bottom: 22px; width: 4px; border-radius: 4px; background: var(--line); }
.stop { position: relative; }
.stop button { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: none; border: 0; padding: 10px 0; cursor: pointer; }
.pin { position: relative; z-index: 1; width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--surface); border: 4px solid var(--line); font-size: 13px; font-weight: 700; color: var(--muted); }
.stop.done .pin { background: var(--cobalt); border-color: var(--cobalt); color: var(--cobalt-ink); }
.stop.next .pin { border-color: var(--cobalt); color: var(--cobalt); background: var(--surface); box-shadow: 0 0 0 5px var(--cobalt-soft); }
.stop .body { flex: 1; min-width: 0; background: var(--surface); border-radius: var(--r); padding: 12px 14px; border: 1px solid var(--line); }
.stop.next .body { border-color: var(--cobalt); }
.stop .meta { font-size: 14px; color: var(--muted); margin-top: 1px; }
.stop.done .meta { color: var(--ok); font-weight: 600; }
.stop button:active .body { transform: scale(.985); }
.tip { background: var(--surface); border-left: 4px solid var(--sign); border-radius: var(--r-sm); padding: 12px 14px; font-size: 15px; color: var(--ink-2); }

/* Barra superior das telas internas */
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.top .grow { flex: 1; min-width: 0; }
.top .label { font-size: 14px; color: var(--muted); }
.top .title { font-weight: 700; font-size: 16px; }
.count { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; color: var(--muted); }
.bar { display: flex; gap: 4px; margin: 0 0 26px; }
.bar i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.bar i.ok { background: var(--ok); } .bar i.bad { background: var(--bad); } .bar i.now { background: var(--cobalt); }

/* Pergunta */
.kicker { font-size: 15px; color: var(--muted); margin-bottom: 8px; }
.q { font-family: var(--display); font-weight: 600; font-size: 27px; line-height: 1.22; letter-spacing: -.02em; margin: 0 0 24px; }
.blank { display: inline-block; min-width: 64px; height: .95em; vertical-align: -.1em; border-radius: 8px; background: var(--sign-soft); box-shadow: inset 0 -3px 0 var(--sign); }
.blank.filled { background: none; box-shadow: none; min-width: 0; height: auto; color: var(--cobalt); }
.field { width: 100%; font: 500 20px/1.35 var(--text); color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 16px 18px; outline: none; }
.field:focus { border-color: var(--cobalt); }
textarea.field { min-height: 120px; resize: vertical; font-size: 18px; }
.actions { margin-top: 14px; display: flex; gap: 10px; }
.btn { flex: 1; appearance: none; border: 0; border-radius: 99px; padding: 16px 20px; font-weight: 700; font-size: 17px; cursor: pointer; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--cobalt); color: var(--cobalt-ink); }
.btn-soft { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn-ok { background: var(--ok); color: #fff; }
.btn-bad { background: var(--bad); color: #fff; }
@media (prefers-color-scheme: dark) { .btn-ok, .btn-bad { color: #0D1120; } }
.text-btn { background: none; border: 0; color: var(--cobalt); font-weight: 600; font-size: 15px; padding: 14px 4px; cursor: pointer; }
.list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 28px; }
.list-head h2 { margin: 0; }
.list-head h2 .muted { font-weight: 600; margin-left: 4px; }
.list-head .text-btn { padding: 8px 4px; }
.center { text-align: center; }

/* Resultado da resposta */
.result { border-radius: var(--r-lg); padding: 18px 18px 16px; margin-top: 4px; animation: rise .22s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.result.ok { background: var(--ok-soft); }
.result.bad { background: var(--bad-soft); }
.result.neutral { background: var(--surface); border: 1px solid var(--line); }
.verdict { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 750; font-size: 22px; letter-spacing: -.02em; margin-bottom: 10px; }
.verdict .mark { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.ok .verdict { color: var(--ok); } .ok .mark { background: var(--ok); }
.bad .verdict { color: var(--bad); } .bad .mark { background: var(--bad); }
@media (prefers-color-scheme: dark) { .verdict .mark { color: #0D1120; } }
.mark svg { width: 16px; height: 16px; }
.yours { font-size: 15px; color: var(--ink-2); margin-bottom: 8px; }
.yours s { text-decoration-thickness: 2px; }
.sentence { font-size: 19px; line-height: 1.4; font-weight: 500; margin: 0 0 8px; }
.sentence b { color: var(--cobalt); font-weight: 700; }
.why { font-size: 15px; color: var(--ink-2); }
.result .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 8px; }
.listen { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 7px 14px 7px 10px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--ink); }
.listen svg { width: 18px; height: 18px; color: var(--cobalt); }
.note { font-size: 14px; color: var(--muted); margin: 12px 4px 0; }

/* Conteúdo de leitura */
.rule { position: relative; background: var(--surface); border-radius: var(--r); padding: 16px; margin-bottom: 12px; border: 1px solid var(--line); }
.rule h3 { font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: -.015em; margin: 0 0 10px; padding-right: 30px; line-height: 1.25; }
.r-num { position: absolute; top: 14px; right: 14px; width: 22px; height: 22px; border-radius: 50%; background: var(--sunk); color: var(--muted);
  font: 700 12px var(--text); display: grid; place-items: center; }
.r-when { color: var(--ink-2); font-weight: 600; }
.r-arrow { display: inline-block; vertical-align: -2px; color: var(--muted); margin: 0 2px; }
.r-arrow svg { width: 15px; height: 15px; }
.r-use { color: var(--ink); }
.r-row { display: flex; align-items: baseline; gap: 8px; margin-top: 7px; }
.r-lab { flex: none; width: 48px; font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip-form, .chip-clue, .chip-plain { font-size: 13.5px; font-weight: 600; border-radius: 7px; padding: 2px 7px; }
.chip-form { background: var(--cobalt-soft); color: var(--cobalt); }
.chip-clue { background: var(--sign-soft); color: var(--rev-ink); }
.chip-plain { background: var(--sunk); color: var(--ink-2); }
.rule .ln { font-size: 15px; color: var(--ink-2); margin-top: 7px; }
.example { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.example span { flex: 1; font-weight: 600; }
.hl-form { color: var(--cobalt); font-weight: 800; }
.hl-clue { background: linear-gradient(transparent 52%, var(--sign-soft) 52%); font-weight: 800; }
.read { background: var(--surface); border-radius: var(--r); padding: 16px; margin-bottom: 10px; border: 1px solid var(--line); }
.read .en { font-size: 19px; font-weight: 600; line-height: 1.35; }
.read .pt { color: var(--muted); font-size: 15px; margin-top: 8px; }
.read .row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.flip { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 14px; min-height: 128px; cursor: pointer; text-align: left; display: flex; flex-direction: column; justify-content: space-between; }
.flip .w { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -.02em; line-height: 1.1; }
.flip .hint { font-size: 13px; color: var(--muted); }
.flip.open { grid-column: 1 / -1; background: var(--cobalt-soft); border-color: transparent; }
.flip .pt { font-size: 16px; font-weight: 600; margin-top: 6px; }
.flip .ex { font-size: 15px; color: var(--ink-2); font-style: italic; margin: 6px 0 10px; }
.flip .ex-pt { font-size: 14px; color: var(--muted); margin: -4px 0 10px; }

/* Resultado final */
.score { font-family: var(--display); font-weight: 800; font-size: 88px; letter-spacing: -.06em; line-height: .9; margin: 18px 0 4px; }
.score small { font-size: 36px; color: var(--muted); letter-spacing: -.03em; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 6px 16px; margin: 20px 0 14px; }
.item { padding: 14px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .where { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.item .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.chip { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--sunk); color: var(--ink-2); }
.chip.today { background: var(--sign-soft); color: var(--ink); }
.dots { display: inline-flex; gap: 3px; margin-left: auto; margin-right: 8px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--ok); }

.empty { text-align: center; padding: 40px 12px 20px; }
.empty .art { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 14px; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); }
.empty .art svg { width: 34px; height: 34px; }

/* Barra de abas */
.tabbar { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); max-width: 420px; margin: 0 auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 99px; display: flex; padding: 6px; z-index: 10;
  box-shadow: 0 8px 28px rgba(19, 23, 41, .12); }
.tab { flex: 1; min-width: 0; background: none; border: 0; border-radius: 99px; color: var(--muted); font-weight: 600; font-size: 12.5px; padding: 8px 0; cursor: pointer; position: relative;
  display: flex; align-items: center; justify-content: center; gap: 5px; }
.tab span:not(.dot) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab svg { width: 20px; height: 20px; }
.tab.on { background: var(--cobalt); color: var(--cobalt-ink); }
.tab .dot { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--sign); color: var(--sign-ink); font-size: 11px; font-weight: 800; line-height: 18px; text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px); background: var(--ink); color: var(--bg);
  padding: 11px 18px; border-radius: 18px; width: max-content; max-width: calc(100vw - 40px); text-align: center; font-size: 15px; font-weight: 600; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
/* Topo: status offline */
.brand-right { display: flex; align-items: center; gap: 8px; }
.offline { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; padding: 0; }
.offline svg { width: 20px; height: 20px; }
.offline.ok { color: var(--ok); }
.offline.partial { color: var(--bad); }
.offline.checking { color: var(--muted); }
.offline.checking svg { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* Semanas anteriores e próximas */
.sub-h { font-size: 18px; margin-bottom: 10px; }
.week-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
.week-row .grow { flex: 1; min-width: 0; }
.week-row .meta { display: block; font-size: 14px; color: var(--muted); }
.week-row .frac { font-weight: 700; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.week-row .chev { color: var(--muted); display: grid; transition: transform .2s; }
.week-row .chev svg { width: 18px; height: 18px; }
.week-row .chev.up { transform: rotate(90deg); }
.week-row + .week { margin: 4px 0 16px; }
.all-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.all-head .frac { font-size: 14px; color: var(--muted); font-weight: 600; }
.overall { height: 6px; border-radius: 3px; background: var(--line); margin: 2px 0 14px; overflow: hidden; }
.overall i { display: block; height: 100%; background: var(--cobalt); border-radius: 3px; }
.mod-num { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--sunk); color: var(--ink-2); }
.week-row.done .mod-num { background: var(--cobalt); color: var(--cobalt-ink); }
.week-row.current { border-color: var(--cobalt); }
.week-row.current .mod-num { background: var(--cobalt-soft); color: var(--cobalt); }
.week-row.current .meta { color: var(--cobalt); font-weight: 600; }
.week-row.locked-row { background: transparent; border-style: dashed; }
.week-row.locked-row h3 { color: var(--ink-2); font-weight: 500; }
.week-row .state { display: grid; color: var(--muted); }
.week-row .state svg { width: 20px; height: 20px; }
.week-row .state.ok { color: var(--ok); }
.unlock { display: flex; gap: 12px; align-items: flex-start; background: var(--cobalt-soft); border-radius: var(--r-lg); padding: 16px; margin-top: 16px; }
.unlock .mark { width: 30px; height: 30px; border-radius: 50%; background: var(--cobalt); color: var(--cobalt-ink); display: grid; place-items: center; flex: none; }
.unlock .mark svg { width: 16px; height: 16px; }
.unlock p { margin: 2px 0 0; font-size: 15px; color: var(--ink-2); }
.locked { border: 2px dashed var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 20px; }
.locked h3 { color: var(--ink-2); }
.locked .meta { font-size: 14px; color: var(--muted); }
.tip-btn { width: 100%; text-align: left; cursor: pointer; border-top: 0; border-right: 0; border-bottom: 0; font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); }

/* Backup */
.backup { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
.backup h2 { font-size: 19px; margin-bottom: 6px; }
/* ===== Percurso (início) ===== */
.bar-top { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; justify-content: space-between;
  margin: -12px -20px 8px; padding: 10px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.bar-top .wordmark { font-size: 26px; }
.nudge { display: block; width: 100%; border: 0; border-radius: 14px; background: var(--sign-soft); color: var(--ink); font-weight: 600; font-size: 14px; padding: 10px 14px; margin-bottom: 12px; text-align: left; cursor: pointer; }
.module { --m-dark: color-mix(in srgb, var(--m) 72%, #000); --m-soft: color-mix(in srgb, var(--m) 22%, transparent); margin-bottom: 6px; }
.module { margin-bottom: 10px; }
.banner { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer; background: var(--surface); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 20px; padding: 12px 14px 12px 12px; box-shadow: 0 4px 0 var(--line); transition: transform .08s, box-shadow .08s; }
.banner:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.module.expanded .banner { position: sticky; top: 56px; z-index: 5; }
.module.current .banner { border-color: var(--m); box-shadow: 0 4px 0 var(--m-dark); }
.m-icon { position: relative; width: 48px; height: 48px; flex: none; border-radius: 15px; display: grid; place-items: center;
  background: var(--m); color: #fff; box-shadow: inset 0 -4px 0 var(--m-dark); }
.m-icon svg { width: 26px; height: 26px; margin-top: -2px; }
.m-done { position: absolute; right: -5px; bottom: -5px; width: 20px; height: 20px; border-radius: 50%; background: var(--sign); color: var(--sign-ink);
  display: grid; place-items: center; border: 2.5px solid var(--surface); }
.m-done svg { width: 11px; height: 11px; margin: 0; }
.b-label { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.b-status { white-space: nowrap; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--sunk); color: var(--ink-2); }
.module.current .b-status { background: var(--m-soft); color: var(--m); }
.module.complete .b-status { background: var(--ok-soft); color: var(--ok); }
.b-title { display: block; font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: -.015em; margin-top: 2px; }
.segs { display: flex; gap: 3px; margin-top: 8px; }
.segs i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.segs i.on { background: var(--m); }
.b-chev { display: grid; color: var(--muted); transition: transform .2s; }
.b-chev svg { width: 20px; height: 20px; }
.module.expanded .b-chev { transform: rotate(90deg); }
.banner .grow { flex: 1; min-width: 0; }
.module.is-locked .m-icon { background: var(--m-soft); color: var(--m); box-shadow: none; }
.module.is-locked .b-status { display: none; }
.module.is-locked .segs i { background: var(--sunk); }
.module.is-locked .b-title { color: var(--ink-2); }
.module.is-locked.expanded .b-chev { transform: none; }
.path { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 0 24px; }
.step.open { z-index: 4; }
.step.is-next { margin-top: 40px; }
.step { position: relative; display: flex; flex-direction: column; align-items: center; transform: translateX(var(--x)); }
.node { position: relative; width: 60px; height: 57px; border: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center;
  background: var(--m); color: #fff; box-shadow: 0 6px 0 var(--m-dark); transition: transform .08s, box-shadow .08s; }
.node svg { width: 26px; height: 26px; }
.node:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--m-dark); }
.node-lbl { display: block; max-width: 112px; margin: 7px 0 2px; font-size: 12.5px; font-weight: 600; line-height: 1.2; text-align: center; color: var(--ink-2); }
.step.is-locked .node-lbl { color: var(--muted); }
.step.is-next .node-lbl { color: var(--m); font-weight: 700; }
.node.locked { background: var(--sunk); color: var(--muted); box-shadow: 0 6px 0 var(--line); }
.node.gold { background: var(--sign); color: #2A2100; box-shadow: 0 6px 0 #C99A00; }
.node.lesson { background: var(--surface); color: var(--m); box-shadow: 0 6px 0 var(--line), inset 0 0 0 2.5px var(--m); }
.node.lesson.locked { color: var(--muted); box-shadow: 0 6px 0 var(--line), inset 0 0 0 2.5px var(--line); }
.node.lesson.gold-dark { background: #B88A08; color: #FFF7E0; box-shadow: 0 6px 0 #7A5B00, inset 0 0 0 2.5px #FFD23F; }
.node.lesson + .node-lbl { color: var(--m); }
.node.lesson.gold-dark + .node-lbl { color: #B88A08; font-weight: 700; }
.step.is-done .node.gold ~ .node-lbl, .node.gold + .node-lbl { color: #A77C00; font-weight: 700; }
.module.mastered .m-done { background: var(--sign); color: #2A2100; }
.ring { position: absolute; inset: -11px; border-radius: 50%; border: 5px solid var(--m-soft); pointer-events: none; animation: ring 2.4s ease-in-out infinite; }
@keyframes ring { 50% { transform: scale(1.06); border-color: color-mix(in srgb, var(--m) 35%, transparent); } }
.go-tag { position: absolute; bottom: calc(100% + 10px); white-space: nowrap; background: var(--surface); color: var(--m); border: 2px solid var(--line);
  font-weight: 800; font-size: 14px; padding: 5px 12px; border-radius: 11px; z-index: 2; animation: bob 1.8s ease-in-out infinite; }
.go-tag::after { content: ""; position: absolute; left: 50%; top: 100%; width: 10px; height: 10px; background: var(--surface); border: 2px solid var(--line);
  border-top: 0; border-left: 0; transform: translate(-50%, -5px) rotate(45deg); }
@keyframes bob { 50% { transform: translateY(-4px); } }
.trophy { width: 54px; height: 54px; border-radius: 18px; margin-top: 8px; display: grid; place-items: center; background: var(--sunk); color: var(--muted); box-shadow: 0 6px 0 var(--line); }
.trophy svg { width: 26px; height: 26px; }
.trophy.won { background: var(--sign); color: var(--sign-ink); box-shadow: 0 6px 0 #C99A00; }
.bubble { position: absolute; top: calc(100% + 10px); left: 50%; width: min(300px, calc(100vw - 40px)); z-index: 4;
  transform: translateX(calc(-50% - var(--x))); background: var(--m); color: #fff; border-radius: 18px; padding: 16px; box-shadow: 0 10px 30px rgba(19,23,41,.18);
  animation: pop .16s ease-out; }
.bubble::before { content: ""; position: absolute; top: -7px; left: calc(50% + var(--x)); width: 16px; height: 16px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 3px; }
@keyframes pop { from { opacity: 0; transform: translateX(calc(-50% - var(--x))) translateY(-6px); } }
.module.is-locked .bubble, .bubble:has(.off) { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.bub-title { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -.01em; }
.bub-sub { font-size: 15px; opacity: .9; margin: 2px 0 12px; }
.bub-btn { width: 100%; border: 0; border-radius: 14px; padding: 13px; font-weight: 800; font-size: 16px; background: #fff; color: var(--m); box-shadow: 0 4px 0 rgba(0,0,0,.18); cursor: pointer; }
.bub-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.bub-btn.off { background: var(--sunk); color: var(--muted); box-shadow: none; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 6px; margin-top: 10px; }
.stats div { position: relative; text-align: center; padding: 0 4px; font-size: 11.5px; line-height: 1.2; color: var(--muted); }
.stats div + div::before { content: ""; position: absolute; left: 0; top: 2px; bottom: 2px; border-left: 1px solid var(--line); }
.stats b { display: block; font-family: var(--display); font-size: 22px; color: var(--ink); letter-spacing: -.03em; line-height: 1.15; margin-bottom: 1px; }
@media (prefers-color-scheme: dark) { .bubble { box-shadow: none; } .bub-btn { background: #fff; } }
/* ===== Estudar agora e meta ===== */
.study { --m-dark: color-mix(in srgb, var(--m) 72%, #000); display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; cursor: pointer;
  background: var(--m); color: #fff; border-radius: 20px; padding: 16px 16px 16px 18px; margin: 4px 0 16px; box-shadow: 0 5px 0 var(--m-dark); transition: transform .08s, box-shadow .08s; }
.study:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--m-dark); }
.study .grow { flex: 1; min-width: 0; }
.s-title { display: block; font-family: var(--display); font-weight: 750; font-size: 21px; letter-spacing: -.02em; line-height: 1.15; }
.s-sub { display: block; font-size: 14px; opacity: .9; margin-top: 2px; }
.s-go { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; flex: none; }
.s-go svg { width: 20px; height: 20px; }
.goal { display: flex; align-items: center; gap: 4px; height: 34px; padding: 0 12px 0 3px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px; color: var(--ink); cursor: pointer; }
.g-ring { position: relative; width: 28px; height: 28px; display: grid; place-items: center; }
.g-ring svg:first-child { position: absolute; inset: 0; width: 28px; height: 28px; transform: rotate(-90deg); }
.g-ring svg + svg, .g-ring > svg:last-child { width: 15px; height: 15px; }
.g-bg { fill: none; stroke: var(--sunk); stroke-width: 4; }
.g-fg { fill: none; stroke: #FFB020; stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset .4s; }
.goal.hit { border-color: #FFB020; }

/* ===== Exercício em foco ===== */
body.focus .tabbar { display: none; }
body.focus { padding-bottom: 0; }
body.focus main { padding-bottom: 300px; }
.qtop { display: flex; align-items: center; gap: 12px; margin: 0 0 6px; }
.qtop .bar { flex: 1; margin: 0; }
.qctx { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.qbody { display: flex; flex-direction: column; justify-content: center; min-height: calc(100dvh - 260px); padding: 18px 0; }
.qbody .q:last-child { margin-bottom: 0; }
.gaps { display: flex; gap: 10px; }
.gap { flex: 1; min-width: 0; position: relative; }
.gap > span { position: absolute; top: -7px; left: 12px; z-index: 1; background: var(--cobalt); color: var(--cobalt-ink);
  width: 18px; height: 18px; border-radius: 50%; font: 700 11px/18px var(--text); text-align: center; }
.gap .field { width: 100%; }
.blank i { font-style: normal; font-size: .55em; vertical-align: super; color: var(--cobalt); font-weight: 800; margin-left: 1px; }
.vhint { font: inherit; color: var(--cobalt); background: none; border: 0; border-bottom: 2px dotted var(--cobalt); padding: 0 1px; cursor: pointer; }
.vhint.on { background: var(--cobalt-soft); border-radius: 6px; border-bottom-color: transparent; }
.vsheet { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin: -8px 0 18px; }
.vrow { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.vcell { display: flex; flex-direction: column; min-width: 68px; }
.vlab { font-size: 11.5px; color: var(--muted); }
.vcell b { font-size: 16px; }
.vsheet .tiny { margin: 8px 0 0; }
.qbody.settled { min-height: 0; justify-content: flex-start; padding-top: 24px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { min-height: 58px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font-size: 18px; font-weight: 600;
  padding: 10px 12px; cursor: pointer; box-shadow: 0 3px 0 var(--line); transition: transform .06s; }
.opt:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt.sel { border-color: var(--cobalt); background: var(--cobalt-soft); color: var(--cobalt); box-shadow: 0 3px 0 var(--cobalt); }
.build { min-height: 112px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; padding: 10px 0 12px; margin-bottom: 18px;
  background-image: linear-gradient(var(--line), var(--line)), linear-gradient(var(--line), var(--line)); background-size: 100% 2px; background-repeat: no-repeat; background-position: 0 52px, 0 104px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 8px 12px; font-size: 17px; font-weight: 500;
  cursor: pointer; box-shadow: 0 3px 0 var(--line); }
.tile:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.tile.used { background: var(--sunk); color: transparent; box-shadow: none; border-color: var(--sunk); }
.play-row { display: flex; align-items: flex-end; gap: 14px; margin: 6px 0 22px; }
.play { width: 84px; height: 84px; border-radius: 24px; border: 0; background: var(--cobalt); color: #fff; display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 5px 0 color-mix(in srgb, var(--cobalt) 70%, #000); }
.play svg { width: 40px; height: 40px; }
.play.slow { width: auto; height: 48px; padding: 0 16px; border-radius: 14px; font-weight: 800; font-size: 15px; }
.play.slow svg { width: 28px; height: 28px; }
.play:active { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--cobalt) 70%, #000); }
.mode-tag { display: flex; align-items: center; gap: 6px; width: fit-content; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--cobalt); background: var(--cobalt-soft); padding: 4px 10px; border-radius: 99px; }
.mode-tag svg { width: 14px; height: 14px; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; padding: 12px 20px calc(14px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
.dock > * { max-width: 500px; margin-left: auto; margin-right: auto; }
.dock .btn { width: 100%; display: block; }
.dock.fb { padding: 0; border-top: 0; background: none; }
.sheet { padding: 18px 20px calc(16px + env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0; animation: up .2s ease-out; max-width: none; }
.sheet > * { max-width: 500px; margin-left: auto; margin-right: auto; }
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
.sheet.ok { background: var(--ok-soft); } .sheet.bad { background: var(--bad-soft); } .sheet.neutral { background: var(--surface); border-top: 1px solid var(--line); }
.sheet.ok .verdict { color: var(--ok); } .sheet.ok .mark { background: var(--ok); }
.sheet.bad .verdict { color: var(--bad); } .sheet.bad .mark { background: var(--bad); }
.sheet .row { display: flex; align-items: center; justify-content: space-between; margin: 10px auto 14px; }
.sheet .btn { width: 100%; display: block; }
.btn:disabled { opacity: .45; }
.actions.stack { flex-direction: column; }

/* ===== Conclusão ===== */
.hero { text-align: center; padding: 16px 0 6px; }
.hero-trophy { width: 104px; height: 104px; margin: 8px auto 14px; border-radius: 32px; background: var(--sign); color: var(--sign-ink); display: grid; place-items: center;
  box-shadow: 0 7px 0 #C99A00; animation: popin .5s cubic-bezier(.2,1.6,.4,1); }
.hero-trophy svg { width: 54px; height: 54px; }
@keyframes popin { from { transform: scale(.4); opacity: 0; } }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

/* ===== Progresso ===== */
.chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 10px; margin-top: 10px; }
.climb { background: #2F4BFF; color: #fff; border-radius: var(--r); margin-top: 10px; overflow: hidden; }
.climb-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px 0; }
.climb-head h3 { margin: 0; font-size: 17px; color: #fff; }
.climb-head p { margin: 2px 0 0; font-size: 14px; color: rgba(255,255,255,.78); line-height: 1.35; }
.climb-head b { font-family: "Bricolage", sans-serif; font-size: 28px; line-height: 1; letter-spacing: -.03em; color: #FFD23F; }
.climb-art { position: relative; margin-top: 4px; }
.climb-art svg { display: block; width: 100%; height: auto; }
.climb-lbl { font: 700 11px -apple-system, system-ui, sans-serif; fill: rgba(255,255,255,.6); }
.climb-lbl.on { fill: #FFD23F; }
.climb-me { position: absolute; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 0 0 3px #FFD23F, 0 4px 10px rgba(0,0,0,.3); pointer-events: none; }
.climb-me .avatar { width: 34px !important; height: 34px !important; font-size: 13px !important; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.chart { position: relative; height: 120px; display: flex; gap: 8px; align-items: flex-end; padding-bottom: 20px; }
.chart .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.chart .col span { position: absolute; bottom: -20px; font-size: 12px; color: var(--muted); font-weight: 600; }
.chart .col.today span { color: var(--ink); }
.bar-v { width: 100%; max-width: 30px; border-radius: 7px; background: var(--cobalt-soft); }
.bar-v.hit { background: var(--cobalt); }
.goal-line { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--line); height: 0; }
.goal-line span { position: absolute; right: 0; top: -18px; font-size: 11px; color: var(--muted); }
.pick { display: grid; gap: 8px; }
.pick-op { display: flex; flex-direction: column; gap: 1px; text-align: left; cursor: pointer; background: var(--surface); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 15px; padding: 10px 14px; font-family: var(--text); }
.pick-op b { font-size: 16px; }
.pick-op span { font-size: 13px; color: var(--muted); line-height: 1.25; }
.pick-op.on { border-color: var(--cobalt); box-shadow: 0 0 0 3px var(--cobalt-soft); }
.pick-op.on b { color: var(--cobalt); }
.goal-set { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-weight: 600; }
.seg { display: flex; background: var(--sunk); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 6px 12px; font-size: 15px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* ===== Boas-vindas ===== */
.welcome { text-align: center; padding: 12vh 8px 0; }
.welcome.setup { padding-top: 4vh; padding-bottom: 140px; }
.welcome.setup .w-art { width: 76px; height: 76px; border-radius: 24px; margin-bottom: 16px; }
.welcome.setup .w-art svg { width: 38px; height: 38px; }
.welcome.setup h1 { font-size: 25px; }
.w-art { width: 120px; height: 120px; border-radius: 36px; margin: 0 auto 24px; background: var(--m); color: #fff; display: grid; place-items: center;
  box-shadow: 0 7px 0 color-mix(in srgb, var(--m) 70%, #000); }
.w-art svg { width: 58px; height: 58px; }
.w-logo { width: 132px; height: 132px; border-radius: 34px; margin: 0 auto 26px; background: #2F4BFF; color: #fff; display: flex; align-items: baseline; justify-content: center;
  padding-top: 18px; font-family: var(--display); font-weight: 800; font-size: 96px; line-height: 1; letter-spacing: -.04em; box-shadow: 0 7px 0 #1F33B8; animation: popin .5s cubic-bezier(.2,1.6,.4,1); }
.w-logo i { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: #FFD23F; margin-left: 6px; }
.welcome h1 { font-size: 30px; }
.welcome p { max-width: 340px; margin: 8px auto 0; }
.w-dots { display: flex; justify-content: center; gap: 6px; margin-top: 28px; }
.w-dots i { width: 8px; height: 8px; border-radius: 99px; background: var(--line); transition: width .2s; }
.w-dots i.on { width: 22px; background: var(--cobalt); }
/* ===== Reforço ===== */
.weak-badge { position: absolute; right: -6px; top: -6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 99px; background: #F08C2E; color: #fff;
  font-size: 13px; font-weight: 800; display: grid; place-items: center; border: 3px solid var(--bg); box-sizing: content-box; line-height: 1; }
.b-weak { white-space: nowrap; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: color-mix(in srgb, #F08C2E 18%, transparent); color: #D9711A; }
@media (prefers-color-scheme: dark) { .b-weak { color: #FFB066; } }
.trophy.silver { background: var(--surface); color: var(--m); border: 3px solid var(--m-soft); box-shadow: 0 6px 0 var(--line); }
.bub-link { display: block; width: 100%; margin-top: 8px; background: none; border: 0; color: inherit; opacity: .9; font-weight: 700; font-size: 15px; padding: 8px; cursor: pointer; }
/* ===== Níveis ===== */
.level { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: none; border: 0; padding: 18px 2px 12px; cursor: pointer; color: var(--ink); }
.level .grow { flex: 1; min-width: 0; }
.lv-badge { flex: none; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 20px;
  letter-spacing: -.02em; background: var(--ink); color: var(--bg); }
.lv-badge.sm { width: auto; height: 28px; padding: 0 9px; border-radius: 9px; font-size: 14px; }
.lv-name { display: block; font-family: var(--display); font-weight: 750; font-size: 19px; letter-spacing: -.02em; }
.lv-sub { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }
.lv-bar { display: block; height: 5px; border-radius: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
.lv-bar i { display: block; height: 100%; background: var(--ink); border-radius: 3px; }
.level .b-chev.open { transform: rotate(90deg); }
.level.soon { cursor: default; opacity: .75; }
.level.soon .lv-badge { background: var(--sunk); color: var(--muted); }
.lv-pill { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.more-soon { text-align: center; font-size: 13px; color: var(--muted); border: 2px dashed var(--line); border-radius: 16px; padding: 12px; margin: 4px 0 12px; }
.lv-hero { width: 120px; height: 120px; margin: 0 auto 22px; border-radius: 36px; background: var(--ink); color: var(--bg); display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 48px; letter-spacing: -.04em; animation: popin .5s cubic-bezier(.2,1.6,.4,1); }

/* ===== Perfil ===== */
.profile { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin-top: 14px; }
.profile .grow { flex: 1; min-width: 0; }
.av-btn { position: relative; border: 0; background: none; padding: 0; cursor: pointer; flex: none; }

.hero-cta { display: block; width: 100%; border: 0; cursor: pointer; background: #fff; color: var(--m-dark); font: 700 17px var(--text); padding: 13px; border-radius: 99px; transition: transform .08s; }

.rev-strip { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; cursor: pointer; text-align: left;
  background: var(--sign-soft); color: var(--rev-ink); border-radius: 18px; padding: 13px 16px; font: 600 16px var(--text); }

.lv-list { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 0 16px; overflow: hidden; }
.lv-row { position: relative; display: flex; align-items: center; gap: 13px; width: 100%; padding: 11px 0; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer; text-align: left; color: var(--ink); font-family: var(--text); }
.lv-row:first-child { border-top: 0; }
.lv-row b { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 15px; background: var(--sunk); color: var(--ink-2); }

.lv-row .s svg { width: 15px; height: 15px; }
.lv-row::before { content: ""; position: absolute; left: 18px; top: 0; bottom: 0; width: 2px; background: var(--line); }

.lv-row:last-child::before { bottom: 50%; }
.lv-row b { position: relative; z-index: 1; }
.lv-row.past::before, .lv-row.past + .lv-row::before { background: var(--ok); }
.lv-row.cur::before { background: linear-gradient(var(--ok), var(--cobalt) 50%, var(--line) 50%); }
.lv-row.past b { background: var(--ok-soft); color: var(--ok); }
